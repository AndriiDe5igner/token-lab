name = "token-lab"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "token-lab"
# Плейсхолдер для локальної розробки. Перед деплоєм замінити на id з `wrangler d1 create token-lab`
# (id бази не секрет, токени Cloudflare - секрет і в репо не потрапляють).
database_id = "00000000-0000-0000-0000-000000000000"
